name: Validate Pages builds

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test collector
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build production
        env:
          VITE_DEPLOY_ENV: production
          VITE_PUBLIC_URL: https://shiruba.software/prompt-wrapped
        run: npm run build

      - name: Build staging
        env:
          VITE_DEPLOY_ENV: staging
          VITE_PUBLIC_URL: https://shiruba.software/prompt-wrapped/staging
        run: npm run build
